[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-tracker-mcp"
version = "0.1.0"
description = "MCP server exposing Project Tracker issues to Claude and other MCP clients"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3.0", "httpx>=0.27,<1.0"]

[project.scripts]
project-tracker-mcp = "tracker_mcp.__main__:main"

[tool.setuptools]
packages = ["tracker_mcp"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
